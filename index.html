<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#091426"><title>Weatherly — погода</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;padding:28px 18px;color:#f5f8ff;font-family:'DM Sans',sans-serif;background:radial-gradient(ellipse at 15% 5%,#1b4771,transparent 40%),radial-gradient(ellipse at 90% 35%,#293c69,transparent 38%),#081426}.wrap{max-width:980px;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px}.logo{font-size:26px;font-weight:800;letter-spacing:-1px}.logo span{color:#70d7ff}.muted,.hint{color:#9aacc6}.search{display:flex;gap:10px;margin-bottom:20px}.search input{flex:1;min-width:0;padding:15px 18px;border-radius:15px;border:1px solid #ffffff22;background:#ffffff0d;color:white;font:inherit;outline:none}.search button{border:0;border-radius:15px;background:#75d9ff;color:#08203a;padding:0 23px;font-weight:800;cursor:pointer}.grid{display:grid;grid-template-columns:1.2fr .9fr;gap:16px}.panel{padding:25px;border:1px solid #ffffff1c;border-radius:24px;background:linear-gradient(135deg,#ffffff17,#ffffff08);backdrop-filter:blur(14px);box-shadow:0 20px 60px #0002}.place{font-size:25px;font-weight:700}.date{font-size:13px;color:#9aacc6;margin-top:5px}.hero{display:flex;justify-content:space-between;align-items:center;margin-top:20px}.temp{font-size:88px;line-height:1;font-weight:700;letter-spacing:-6px}.desc{margin-top:10px;color:#c1d1e6}.bigicon{font-size:72px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{padding:17px;border-radius:16px;background:#ffffff0d;color:#9aacc6;font-size:13px}.stat b{display:block;color:white;font-size:21px;margin-top:8px}.section{font-size:19px;margin:24px 0 14px}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:9px}.day{text-align:center;padding:15px 6px;border-radius:16px;background:#ffffff0b;color:#9aacc6;font-size:12px}.day .ico{font-size:25px;margin:12px 0}.day b{display:block;color:white;font-size:16px}.day small{display:block;margin-top:5px}.foot{text-align:center;color:#7186a4;font-size:12px;margin:28px 0}@media(max-width:650px){body{padding:18px 13px}.grid{grid-template-columns:1fr}.tag{display:none}.days{grid-template-columns:repeat(4,1fr)}.temp{font-size:75px}.panel{padding:21px}}
</style></head><body><main class="wrap"><header class="top"><div class="logo">weather<span>ly.</span></div><div class="tag muted">Погода, которая всегда рядом ✦</div></header><form class="search" id="search"><input id="cityInput" value="Warsaw" placeholder="Найти город…" aria-label="Город"><button>Найти →</button></form><p class="hint" id="status">Загружаем прогноз…</p><div class="grid"><section class="panel"><div class="place" id="city">Warsaw</div><div class="date" id="date">—</div><div class="hero"><div><div class="temp" id="temp">—°</div><div class="desc" id="condition">Загрузка…</div></div><div class="bigicon" id="icon">🌤️</div></div></section><section class="panel"><h2 class="section" style="margin-top:0">Погодные условия</h2><div class="stats"><div class="stat">💧 Влажность<b id="humidity">—%</b></div><div class="stat">💨 Ветер<b id="wind">— км/ч</b></div><div class="stat">🌡️ Ощущается<b id="feels">—°</b></div><div class="stat">🌧️ Осадки<b id="rain">— мм</b></div></div></section></div><h2 class="section">Прогноз на 7 дней</h2><section class="days" id="days"></section><footer class="foot">Weatherly © 2026 · Данные Open-Meteo</footer></main>
<script>
const $=id=>document.getElementById(id),codes={0:['☀️','Ясно'],1:['🌤️','Преимущественно ясно'],2:['⛅','Переменная облачность'],3:['☁️','Пасмурно'],45:['🌫️','Туман'],48:['🌫️','Изморозь'],51:['🌦️','Морось'],53:['🌦️','Морось'],55:['🌧️','Сильная морось'],61:['🌧️','Небольшой дождь'],63:['🌧️','Дождь'],65:['🌧️','Сильный дождь'],71:['🌨️','Небольшой снег'],73:['❄️','Снег'],75:['❄️','Сильный снег'],80:['🌦️','Ливень'],81:['🌧️','Ливень'],82:['⛈️','Сильный ливень'],95:['⛈️','Гроза'],96:['⛈️','Гроза с градом'],99:['⛈️','Сильная гроза']};const info=c=>codes[c]||(c>=71&&c<=77?['❄️','Снег']:['🌥️','Переменная погода']);
async function load(name){$('status').textContent='Ищем город…';try{let g=await fetch('https://geocoding-api.open-meteo.com/v1/search?name='+encodeURIComponent(name)+'&count=1&language=ru&format=json');if(!g.ok)throw Error('Ошибка поиска города');let p=(await g.json()).results?.[0];if(!p)throw Error('Город не найден');$('status').textContent='Загружаем погоду…';let q=new URLSearchParams({latitude:p.latitude,longitude:p.longitude,current:'temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m',daily:'weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max',timezone:'auto',forecast_days:'7'});let r=await fetch('https://api.open-meteo.com/v1/forecast?'+q);if(!r.ok)throw Error('Сервис погоды недоступен');let d=await r.json(),c=d.current,[ic,tx]=info(c.weather_code);$('city').textContent=[p.name,p.admin1,p.country].filter(Boolean).join(', ');$('date').textContent=new Intl.DateTimeFormat('ru-RU',{dateStyle:'full'}).format(new Date(c.time));$('temp').textContent=Math.round(c.temperature_2m)+'°';$('condition').textContent=tx;$('icon').textContent=ic;$('humidity').textContent=c.relative_humidity_2m+'%';$('wind').textContent=Math.round(c.wind_speed_10m)+' км/ч';$('feels').textContent=Math.round(c.apparent_temperature)+'°';$('rain').textContent=c.precipitation+' мм';$('days').innerHTML=d.daily.time.map((day,i)=>{let [e]=info(d.daily.weather_code[i]),label=i===0?'Сегодня':new Intl.DateTimeFormat('ru-RU',{weekday:'short'}).format(new Date(day+'T12:00:00'));return '<div class="day">'+label+'<div class="ico">'+e+'</div><b>'+Math.round(d.daily.temperature_2m_max[i])+'°</b><small>'+Math.round(d.daily.temperature_2m_min[i])+'° · '+d.daily.precipitation_probability_max[i]+'%</small></div>'}).join('');$('status').textContent='Обновлено · '+new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'})}catch(e){$('status').textContent=e.message;$('status').style.color='#ffaaaa'}}
$('search').addEventListener('submit',e=>{e.preventDefault();let v=$('cityInput').value.trim();if(v)load(v)});load('Warsaw');
</script></body></html>
